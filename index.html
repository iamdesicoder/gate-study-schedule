<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- iPhone Optimized Viewport: Prevents accidental zooming on taps -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Is Babu Busy? 🧸</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Smooth iOS-like scrolling */
    body { -webkit-overflow-scrolling: touch; }
    /* Hide scrollbar for a cleaner look */
    ::-webkit-scrollbar { display: none; }
    .heart-float {
      position: fixed;
      pointer-events: none;
      z-index: 9999;
      animation: floatUp 2s ease-out forwards;
    }
    @keyframes floatUp {
      0% { transform: translateY(0) scale(1); opacity: 1; }
      100% { transform: translateY(-400px) scale(1.5); opacity: 0; }
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans antialiased p-4 pb-32">
  <div class="max-w-md mx-auto space-y-6 mt-4">
    
    <!-- Cute Header -->
    <header class="text-center space-y-2">
      <div class="inline-block bg-pink-500/20 text-pink-300 px-4 py-1 rounded-full text-xs font-extrabold tracking-widest mb-1">
        FOR MY FAVORITE PERSON ❤️
      </div>
      <h1 class="text-3xl font-extrabold tracking-tight text-white">Is Babu Busy? 🧸</h1>
      <p class="text-sm text-slate-400 px-4">Check my live schedule so you know exactly when to call!</p>
    </header>

    <!-- Real-time Status Card -->
    <div id="statusCard" class="p-6 rounded-3xl border transition-all duration-500 flex items-center justify-between relative overflow-hidden">
      <div class="relative z-10">
        <div class="text-xs uppercase tracking-wider font-bold text-slate-400 mb-1">Live Status</div>
        <div id="statusText" class="text-2xl font-black mt-1">Checking...</div>
        <div id="statusSubtext" class="text-sm mt-1 font-medium text-slate-300"></div>
      </div>
      <div class="relative z-10 flex items-center justify-center h-12 w-12 rounded-full bg-black/20">
        <div id="statusBadge" class="h-4 w-4 rounded-full"></div>
      </div>
    </div>

    <!-- Filter Buttons (Scrollable horizontally on small iPhones) -->
    <div class="flex overflow-x-auto gap-2 pb-2 -mx-4 px-4 snap-x">
      <button onclick="filterSchedule('all')" class="filter-btn snap-start whitespace-nowrap px-5 py-2.5 rounded-full font-semibold text-sm bg-pink-600 text-white shadow-lg shadow-pink-600/30 transition-all">Everything</button>
      <button onclick="filterSchedule('Digital Logic')" class="filter-btn snap-start whitespace-nowrap px-5 py-2.5 rounded-full font-semibold text-sm bg-slate-800 text-slate-300 transition-all">Digital Logic</button>
      <button onclick="filterSchedule('Theory of Computation')" class="filter-btn snap-start whitespace-nowrap px-5 py-2.5 rounded-full font-semibold text-sm bg-slate-800 text-slate-300 transition-all">TOC</button>
      <button onclick="filterSchedule('DBMS')" class="filter-btn snap-start whitespace-nowrap px-5 py-2.5 rounded-full font-semibold text-sm bg-slate-800 text-slate-300 transition-all">DBMS</button>
    </div>

    <!-- Schedule List -->
    <div class="space-y-2">
      <h2 class="text-sm font-bold text-slate-500 pl-2 uppercase tracking-wider">Upcoming Classes</h2>
      <div id="scheduleContainer" class="space-y-3">
        <!-- Injected via JavaScript -->
      </div>
    </div>
  </div>

  <!-- Interactive "Send Hug" Floating Button -->
  <button onclick="sendHug(this)" class="fixed bottom-8 right-6 bg-gradient-to-r from-pink-500 to-rose-500 text-white p-4 rounded-full shadow-[0_8px_30px_rgb(236,72,153,0.4)] hover:scale-105 active:scale-95 transition-all z-50 flex items-center justify-center gap-2 group">
    <span class="text-2xl drop-shadow-md">💌</span>
    <span id="hugText" class="font-bold pr-2 hidden transition-all">Send Hug!</span>
  </button>

  <script>
    const schedule = [
      // DBMS

      { title: "DBMS: Lecture 20", subject: "DBMS", start: "2026-09-20T14:00:00", end: "2026-09-20T18:00:00" },

      // Digital Logic
      { title: "Digital Logic | Lecture 1", subject: "Digital Logic", start: "2026-08-24T09:00:00", end: "2026-08-24T11:00:00" },
      { title: "Digital Logic | Lecture 2", subject: "Digital Logic", start: "2026-08-25T09:00:00", end: "2026-08-25T11:00:00" },

      { title: "Digital Logic | Lecture 14", subject: "Digital Logic", start: "2026-09-10T09:00:00", end: "2026-09-10T11:00:00" },
      { title: "Digital Logic | Lecture 15", subject: "Digital Logic", start: "2026-09-11T09:00:00", end: "2026-09-11T11:00:00" },
      { title: "Digital Logic | Lecture 16", subject: "Digital Logic", start: "2026-09-14T09:00:00", end: "2026-09-14T11:00:00" },
      { title: "Digital Logic | Lecture 17", subject: "Digital Logic", start: "2026-09-15T09:00:00", end: "2026-09-15T11:00:00" },

      // Theory of Computation
      { title: "Theory of Computation - Lecture 1", subject: "Theory of Computation", start: "2026-08-24T14:00:00", end: "2026-08-24T16:00:00" },
      { title: "Theory of Computation - Lecture 2", subject: "Theory of Computation", start: "2026-08-25T14:00:00", end: "2026-08-25T16:00:00" },
      { title: "Theory of Computation - Lecture 3", subject: "Theory of Computation", start: "2026-08-26T14:00:00", end: "2026-08-26T16:00:00" },
      { title: "Theory of Computation - Lecture 4", subject: "Theory of Computation", start: "2026-08-27T14:00:00", end: "2026-08-27T16:00:00" },
      { title: "Theory of Computation - Lecture 5", subject: "Theory of Computation", start: "2026-08-28T14:00:00", end: "2026-08-28T16:00:00" },
      { title: "Theory of Computation - Lecture 6", subject: "Theory of Computation", start: "2026-08-31T14:00:00", end: "2026-08-31T16:00:00" },
      { title: "Theory of Computation - Lecture 7", subject: "Theory of Computation", start: "2026-09-01T14:00:00", end: "2026-09-01T16:00:00" },
      { title: "Theory of Computation - Lecture 8", subject: "Theory of Computation", start: "2026-09-02T14:00:00", end: "2026-09-02T16:00:00" },
      { title: "Theory of Computation - Lecture 9", subject: "Theory of Computation", start: "2026-09-03T14:00:00", end: "2026-09-03T16:00:00" },
      { title: "Theory of Computation - Lecture 10", subject: "Theory of Computation", start: "2026-09-04T14:00:00", end: "2026-09-04T16:00:00" },
      { title: "Theory of Computation - Lecture 11", subject: "Theory of Computation", start: "2026-09-07T14:00:00", end: "2026-09-07T16:00:00" },
      { title: "Theory of Computation - Lecture 12", subject: "Theory of Computation", start: "2026-09-08T14:00:00", end: "2026-09-08T16:00:00" },
      { title: "Theory of Computation - Lecture 13", subject: "Theory of Computation", start: "2026-09-09T14:00:00", end: "2026-09-09T16:00:00" },
      { title: "Theory of Computation - Lecture 14", subject: "Theory of Computation", start: "2026-09-10T14:00:00", end: "2026-09-10T16:00:00" },
      { title: "Theory of Computation - Lecture 15", subject: "Theory of Computation", start: "2026-09-11T14:00:00", end: "2026-09-11T16:00:00" },
      { title: "Theory of Computation - Lecture 16", subject: "Theory of Computation", start: "2026-09-14T14:00:00", end: "2026-09-14T16:00:00" },
      { title: "Theory of Computation - Lecture 17", subject: "Theory of Computation", start: "2026-09-15T14:00:00", end: "2026-09-15T16:00:00" },
      { title: "Theory of Computation - Lecture 18", subject: "Theory of Computation", start: "2026-09-16T14:00:00", end: "2026-09-16T16:00:00" },
      { title: "Theory of Computation - Lecture 19", subject: "Theory of Computation", start: "2026-09-17T14:00:00", end: "2026-09-17T16:00:00" },
      { title: "Theory of Computation - Lecture 20", subject: "Theory of Computation", start: "2026-09-18T14:00:00", end: "2026-09-18T16:00:00" }
    ];

    // Sort chronologically
    schedule.sort((a, b) => new Date(a.start) - new Date(b.start));

    function formatTime(iso) {
      return new Date(iso).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
    }

    function formatDate(iso) {
      return new Date(iso).toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' });
    }

    // Cute interactive button logic
    function sendHug(btn) {
      const text = document.getElementById('hugText');
      text.innerText = "Hug Sent! 🥰";
      text.classList.remove('hidden');
      
      // Create floating heart
      const heart = document.createElement('div');
      heart.innerText = ['💖', '💕', '🧸', '✨'][Math.floor(Math.random() * 4)];
      heart.className = 'heart-float text-4xl drop-shadow-md';
      heart.style.left = (Math.random() * 60 + 20) + 'vw';
      heart.style.bottom = '100px';
      document.body.appendChild(heart);

      setTimeout(() => heart.remove(), 2000);
      setTimeout(() => {
        text.classList.add('hidden');
        text.innerText = "Send Hug!";
      }, 2500);
    }

    function updateStatus() {
      const now = new Date();
      let activeClass = null;
      let nextClass = null;

      for (const item of schedule) {
        const s = new Date(item.start);
        const e = new Date(item.end);
        if (now >= s && now <= e) {
          activeClass = item;
          break;
        }
        if (now < s && !nextClass) {
          nextClass = item;
        }
      }

      const card = document.getElementById('statusCard');
      const text = document.getElementById('statusText');
      const subtext = document.getElementById('statusSubtext');
      const badge = document.getElementById('statusBadge');

      if (activeClass) {
        // Babu is Busy styling
        card.className = "p-6 rounded-3xl border transition-all duration-500 bg-gradient-to-br from-indigo-950/90 to-purple-950/90 border-indigo-500/30 flex items-center justify-between shadow-lg shadow-indigo-900/20";
        text.className = "text-2xl font-black mt-1 text-indigo-300";
        text.innerText = "Babu is in class! 🤫";
        subtext.innerText = `Studying ${activeClass.subject} until ${formatTime(activeClass.end)}.\nTalk to you soon! 💕`;
        badge.className = "h-4 w-4 rounded-full bg-indigo-400 animate-ping shadow-[0_0_15px_rgba(129,140,248,0.8)]";
      } else {
        // Babu is Free styling
        card.className = "p-6 rounded-3xl border transition-all duration-500 bg-gradient-to-br from-pink-950/80 to-rose-950/80 border-pink-500/40 flex items-center justify-between shadow-lg shadow-pink-900/20";
        text.className = "text-2xl font-black mt-1 text-pink-400";
        text.innerText = "Babu is FREE! 🥰";
        if (nextClass) {
          subtext.innerText = `Call him! His next class is at ${formatTime(nextClass.start)}.`;
        } else {
          subtext.innerText = "He has no more classes today! 💖";
        }
        badge.className = "h-4 w-4 rounded-full bg-pink-500 shadow-[0_0_15px_rgba(236,72,153,0.8)]";
      }
    }

    function renderSchedule(filter = 'all') {
      const container = document.getElementById('scheduleContainer');
      container.innerHTML = '';
      const now = new Date();

      // Filter out past classes
      let upcoming = schedule.filter(item => new Date(item.end) >= now);

      if (filter !== 'all') {
        upcoming = upcoming.filter(item => item.subject === filter);
      }

      if (upcoming.length === 0) {
        container.innerHTML = `
          <div class="text-center p-8 bg-slate-900/50 rounded-3xl border border-slate-800/80 border-dashed">
            <span class="text-4xl block mb-2">🎉</span>
            <p class="text-slate-400 font-medium">No upcoming classes for this subject!</p>
          </div>
        `;
        return;
      }

      upcoming.forEach(item => {
        const badgeColor = item.subject === 'DBMS' ? 'bg-amber-500/20 text-amber-400' : 
                           item.subject === 'Digital Logic' ? 'bg-sky-500/20 text-sky-400' : 
                           'bg-purple-500/20 text-purple-400';

        const card = `
          <div class="p-4 rounded-2xl bg-slate-900 border border-slate-800/80 flex items-center justify-between gap-2 shadow-sm">
            <div class="space-y-1.5">
              <span class="text-[10px] px-2 py-0.5 rounded-full font-bold uppercase tracking-wider ${badgeColor}">${item.subject}</span>
              <div class="font-bold text-slate-200 leading-tight">${item.title}</div>
              <div class="text-xs font-semibold text-slate-500">${formatDate(item.start)}</div>
            </div>
            <div class="text-right">
              <div class="text-sm font-extrabold text-white">${formatTime(item.start)}</div>
              <div class="text-[10px] uppercase font-bold text-slate-500 mt-1 pb-1">to ${formatTime(item.end)}</div>
            </div>
          </div>
        `;
        container.innerHTML += card;
      });
    }

    function filterSchedule(category) {
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.className = "filter-btn snap-start whitespace-nowrap px-5 py-2.5 rounded-full font-semibold text-sm bg-slate-800 text-slate-300 transition-all";
      });
      const activeBtn = Array.from(document.querySelectorAll('.filter-btn')).find(btn => btn.innerText.includes(category === 'Theory of Computation' ? 'TOC' : category === 'all' ? 'Everything' : category));
      if (activeBtn) {
          activeBtn.className = "filter-btn snap-start whitespace-nowrap px-5 py-2.5 rounded-full font-semibold text-sm bg-pink-600 text-white shadow-lg shadow-pink-600/30 transition-all";
      }
      renderSchedule(category);
    }

    // Initialize
    updateStatus();
    renderSchedule();
    setInterval(() => {
      updateStatus();
      const currentFilter = document.querySelector('.bg-pink-600').innerText;
      let filterParam = 'all';
      if (currentFilter.includes('Logic')) filterParam = 'Digital Logic';
      if (currentFilter.includes('TOC')) filterParam = 'Theory of Computation';
      if (currentFilter.includes('DBMS')) filterParam = 'DBMS';
      renderSchedule(filterParam);
    }, 60000); 
  </script>
</body>
</html>
