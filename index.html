    // --- DYNAMIC CONTENT ENGINE ---
    function updateDynamicContent() {
      const now = new Date();
      const start = new Date(now.getFullYear(), 0, 0);
      const diff = now - start;
      const oneDay = 1000 * 60 * 60 * 24;
      const dayOfYear = Math.floor(diff / oneDay);
      
      const index = dayOfYear % 30; 
      const hour = now.getHours();

      let noteTitleStr = "Good Morning 💌";
      let noteStr = morningNotes[index];
      
      if (hour >= 12 && hour < 17) {
        noteTitleStr = "Good Afternoon 💌";
        noteStr = afternoonNotes[index];
      } else if (hour >= 17) {
        noteTitleStr = "Good Evening 💌";
        noteStr = eveningNotes[index];
      }

      let cravingStr = (hour < 17) ? dayCravings[index] : nightCravings[index];

      document.getElementById("noteTitle").innerText = noteTitleStr;
      document.getElementById("noteText").innerText = `"${noteStr}"`;
      document.getElementById("cravingText").innerText = cravingStr;
    }

    async function fetchSchedule() {
      try {
        const response = await fetch(SCRIPT_URL);
        schedule = await response.json();
        
        schedule.sort((a, b) => new Date(a.start) - new Date(b.start));
        updateStatus();
        renderSchedule();
      } catch (error) {
        document.getElementById('statusText').innerText = "Network Error 😔";
        document.getElementById('statusSubtext').innerText = "Tell Babu his calendar link is broken!";
      }
    }

    function formatTime(iso) {
      return new Date(iso).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
    }

    function formatDate(iso) {
      return new Date(iso).toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' });
    }

    function formatCountdown(ms) {
      const totalSecs = Math.floor(ms / 1000);
      const h = String(Math.floor(totalSecs / 3600)).padStart(2, '0');
      const m = String(Math.floor((totalSecs % 3600) / 60)).padStart(2, '0');
      const s = String(totalSecs % 60).padStart(2, '0');
      return `${h}h ${m}m ${s}s`;
    }

    function updateStatus() {
      if (schedule.length === 0) return;

      const now = new Date();
      let activeClass = null;
      let nextClass = null;

      for (const item of schedule) {
        const s = new Date(item.start);
        const e = new Date(item.end);
        if (now >= s && now <= e) {
          activeClass = item;
          break;
        }
        if (now < s && !nextClass) {
          nextClass = item;
        }
      }

      const card = document.getElementById('statusCard');
      const text = document.getElementById('statusText');
      const subtext = document.getElementById('statusSubtext');
      const badge = document.getElementById('statusBadge');
      const countdownContainer = document.getElementById('countdownContainer');
      const countdownTimer = document.getElementById('countdownTimer');

      if (activeClass) {
        card.className = "p-6 rounded-3xl border transition-all duration-500 bg-gradient-to-br from-indigo-950/90 to-purple-950/90 border-indigo-500/30 flex items-center justify-between shadow-lg shadow-indigo-900/20";
        text.className = "text-2xl font-black mt-1 text-indigo-300";
        text.innerText = "Babu is in class! 🤫";
        subtext.innerText = `Studying ${activeClass.subject}.\nTalk to you soon! 💕`;
        badge.className = "h-4 w-4 rounded-full bg-indigo-400 animate-ping shadow-[0_0_15px_rgba(129,140,248,0.8)]";
        
        countdownContainer.classList.remove('hidden');
        document.querySelector('#countdownContainer div:first-child').innerText = 'Freedom In:';
        countdownTimer.innerText = formatCountdown(new Date(activeClass.end) - now);
        countdownTimer.className = "text-xl font-mono font-black tracking-tight text-indigo-200";

      } else {
        card.className = "p-6 rounded-3xl border transition-all duration-500 bg-gradient-to-br from-pink-950/80 to-rose-950/80 border-pink-500/40 flex items-center justify-between shadow-lg shadow-pink-900/20";
        text.className = "text-2xl font-black mt-1 text-pink-400";
        text.innerText = "Babu is FREE! 🥰";
        badge.className = "h-4 w-4 rounded-full bg-pink-500 shadow-[0_0_15px_rgba(236,72,153,0.8)]";
        
        if (nextClass) {
          subtext.innerText = `Call him! His next class is at ${formatTime(nextClass.start)}.`;
          countdownContainer.classList.remove('hidden');
          document.querySelector('#countdownContainer div:first-child').innerText = 'Next Class In:';
          countdownTimer.innerText = formatCountdown(new Date(nextClass.start) - now);
          countdownTimer.className = "text-xl font-mono font-black tracking-tight text-pink-200";
        } else {
          subtext.innerText = "He has no more classes scheduled! 💖";
          countdownContainer.classList.add('hidden');
        }
      }
    }

    function renderSchedule(filter = 'all') {
      const container = document.getElementById('scheduleContainer');
      container.innerHTML = '';
      const now = new Date();

      let upcoming = schedule.filter(item => new Date(item.end) >= now);
      if (filter !== 'all') {
        upcoming = upcoming.filter(item => item.subject === filter);
      }

      if (upcoming.length === 0) {
        container.innerHTML = `
          <div class="text-center p-8 bg-slate-900/50 rounded-3xl border border-slate-800/80 border-dashed">
            <span class="text-4xl block mb-2">🎉</span>
            <p class="text-slate-400 text-sm font-medium">No upcoming classes for this subject!</p>
          </div>
        `;
        return;
      }

      upcoming.forEach(item => {
        const badgeColor = item.subject === 'DBMS' ? 'bg-amber-500/20 text-amber-400' : 
                           item.subject === 'Digital Logic' ? 'bg-sky-500/20 text-sky-400' : 
                           'bg-purple-500/20 text-purple-400';

        const card = `
          <div class="p-4 rounded-2xl bg-slate-900 border border-slate-800/80 flex items-center justify-between gap-2 shadow-sm">
            <div class="space-y-1.5">
              <span class="text-[10px] px-2 py-0.5 rounded-full font-bold uppercase tracking-wider ${badgeColor}">${item.subject}</span>
              <div class="font-bold text-slate-200 leading-tight">${item.title}</div>
              <div class="text-xs font-semibold text-slate-500">${formatDate(item.start)}</div>
            </div>
            <div class="text-right">
              <div class="text-sm font-extrabold text-white">${formatTime(item.start)}</div>
              <div class="text-[10px] uppercase font-bold text-slate-500 mt-1 pb-1">to ${formatTime(item.end)}</div>

        `;
        container.innerHTML += card;

    }

    function filterSchedule(category) {
