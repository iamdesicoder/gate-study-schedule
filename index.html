<body class="bg-slate-950 text-slate-100 min-h-screen font-sans antialiased p-4 md:p-8">

    <!-- Header -->
    <header class="text-center space-y-2">
      <h1 class="text-3xl font-extrabold tracking-tight text-white">GATE 2027 Study Schedule</h1>
      <p class="text-sm text-slate-400">Live lecture timings and real-time availability status</p>
    </header>

    <!-- Real-time Status Card -->
    <div id="statusCard" class="p-5 rounded-2xl border transition-all duration-300 bg-slate-900 border-slate-800 flex items-center justify-between">
      <div>
        <div class="text-xs uppercase tracking-wider font-semibold text-slate-400">Current Status</div>
        <div id="statusText" class="text-xl font-bold mt-1 text-slate-200">Checking schedule...</div>
        <div id="statusSubtext" class="text-xs text-slate-400 mt-0.5"></div>
      </div>
      <div id="statusBadge" class="h-4 w-4 rounded-full bg-slate-500 animate-pulse"></div>
    </div>

    <!-- Filter Buttons -->
    <div class="flex flex-wrap gap-2 justify-center text-sm font-medium">
      <button onclick="filterSchedule('all')" class="filter-btn px-4 py-1.5 rounded-full bg-indigo-600 text-white hover:bg-indigo-500 transition">All</button>
      <button onclick="filterSchedule('Digital Logic')" class="filter-btn px-4 py-1.5 rounded-full bg-slate-800 text-slate-300 hover:bg-slate-700 transition">Digital Logic</button>
      <button onclick="filterSchedule('Theory of Computation')" class="filter-btn px-4 py-1.5 rounded-full bg-slate-800 text-slate-300 hover:bg-slate-700 transition">TOC</button>
      <button onclick="filterSchedule('DBMS')" class="filter-btn px-4 py-1.5 rounded-full bg-slate-800 text-slate-300 hover:bg-slate-700 transition">DBMS</button>
    </div>

    <!-- Schedule List -->
    <div id="scheduleContainer" class="space-y-3">
      <!-- Injected via JavaScript -->
    </div>
  </div>

    ];

    // Sort chronologically
    schedule.sort((a, b) => new Date(a.start) - new Date(b.start));

    function formatTime(iso) {
      return new Date(iso).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function formatDate(iso) {
      return new Date(iso).toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
    }

    function updateStatus() {
      const now = new Date();
      let activeClass = null;
      let nextClass = null;

      for (const item of schedule) {
        const s = new Date(item.start);
        const e = new Date(item.end);
        if (now >= s && now <= e) {
          activeClass = item;
          break;
        }
        if (now < s && !nextClass) {
          nextClass = item;
        }
      }

      const card = document.getElementById('statusCard');
      const text = document.getElementById('statusText');
      const subtext = document.getElementById('statusSubtext');
      const badge = document.getElementById('statusBadge');

      if (activeClass) {
        card.className = "p-5 rounded-2xl border transition-all duration-300 bg-rose-950/40 border-rose-800/60 flex items-center justify-between";
        text.className = "text-xl font-bold mt-1 text-rose-400";
        text.innerText = `In Class: ${activeClass.title}`;
        subtext.innerText = `Busy until ${formatTime(activeClass.end)} (${activeClass.mentor})`;
        badge.className = "h-4 w-4 rounded-full bg-rose-500 animate-ping";
      } else {
        card.className = "p-5 rounded-2xl border transition-all duration-300 bg-emerald-950/40 border-emerald-800/60 flex items-center justify-between";
        text.className = "text-xl font-bold mt-1 text-emerald-400";
        text.innerText = "Currently Free / Available";
        if (nextClass) {
          subtext.innerText = `Next class: ${nextClass.title} on ${formatDate(nextClass.start)} at ${formatTime(nextClass.start)}`;
        } else {
          subtext.innerText = "No upcoming classes scheduled.";
        }
        badge.className = "h-4 w-4 rounded-full bg-emerald-500";
      }
    }

    function renderSchedule(filter = 'all') {
      const container = document.getElementById('scheduleContainer');
      container.innerHTML = '';
      
      const now = new Date();

      // First, only keep classes that haven't ended yet
      let upcomingClasses = schedule.filter(item => new Date(item.end) >= now);

      // Then, apply the subject filter if one is selected
      if (filter !== 'all') {
        upcomingClasses = upcomingClasses.filter(item => item.subject === filter);
      }

      // If no classes match the filter/time, show a friendly message
      if (upcomingClasses.length === 0) {
        container.innerHTML = `
          <div class="text-center p-8 bg-slate-900 border border-slate-800/80 rounded-xl">
            <p class="text-slate-400 font-medium">No upcoming classes to show here.</p>
          </div>
        `;
        return;
      }

      // Render the upcoming classes
      upcomingClasses.forEach(item => {
        const badgeColor = item.subject === 'DBMS' ? 'bg-amber-500/20 text-amber-300 border-amber-500/30' : 
                           item.subject === 'Digital Logic' ? 'bg-sky-500/20 text-sky-300 border-sky-500/30' : 
                           'bg-purple-500/20 text-purple-300 border-purple-500/30';

        const card = `
          <div class="p-4 rounded-xl bg-slate-900 border border-slate-800/80 flex flex-col sm:flex-row sm:items-center justify-between gap-3 hover:border-slate-700 transition">
            <div class="space-y-1">
              <div class="flex items-center gap-2">
                <span class="text-xs px-2 py-0.5 rounded-full border font-medium ${badgeColor}">${item.subject}</span>
                <span class="text-xs text-slate-400">${formatDate(item.start)}</span>
              </div>
              <div class="font-semibold text-white text-base">${item.title}</div>
              <div class="text-xs text-slate-400">Mentor: ${item.mentor}</div>
            </div>
            <div class="text-right sm:text-right flex sm:flex-col justify-between items-center sm:items-end border-t sm:border-t-0 pt-2 sm:pt-0 border-slate-800">
              <div class="text-sm font-semibold text-slate-200">${formatTime(item.start)} – ${formatTime(item.end)}</div>
              <div class="text-xs text-slate-500">${(new Date(item.end) - new Date(item.start)) / (1000 * 60)} Mins</div>
            </div>
          </div>
        `;
        container.innerHTML += card;
      });
    }

    function filterSchedule(category) {
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.className = "filter-btn px-4 py-1.5 rounded-full bg-slate-800 text-slate-300 hover:bg-slate-700 transition";
      });
      // Find the button that was clicked and update its style
      const activeBtn = Array.from(document.querySelectorAll('.filter-btn')).find(btn => btn.innerText.includes(category === 'Theory of Computation' ? 'TOC' : category === 'all' ? 'All' : category));
      if (activeBtn) {
          activeBtn.className = "filter-btn px-4 py-1.5 rounded-full bg-indigo-600 text-white hover:bg-indigo-500 transition";
      }
      renderSchedule(category);
    }

    // Initialize
    updateStatus();
    renderSchedule();
    setInterval(() => {
      updateStatus();
      // Re-render the active filter so expired classes disappear automatically
      const currentFilterText = document.querySelector('.bg-indigo-600').innerText;
      let filterParam = 'all';
      if (currentFilterText.includes('Digital Logic')) filterParam = 'Digital Logic';
      if (currentFilterText.includes('TOC')) filterParam = 'Theory of Computation';
      if (currentFilterText.includes('DBMS')) filterParam = 'DBMS';
      renderSchedule(filterParam);
    }, 60000); // refresh status and lists every 60 seconds
  </script>
